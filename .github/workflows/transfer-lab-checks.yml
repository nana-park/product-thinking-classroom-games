name: Transfer lab checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check transfer-lab/app.js
          node --check transfer-lab/core.js
      - name: Verify local allocation and result parsing
        run: node transfer-lab/test.cjs
