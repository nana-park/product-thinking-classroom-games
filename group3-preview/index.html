431 c432" data-node-id="388:2150" data-name="Close"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-19.svg"/></div><div class="c50 c3 c307 c308 c111 c497 c55 c112 c96 c488 c60" data-node-id="522:6645"><p class="c53 c455 c146">   지미와 해를 끼치는 인간에 대한 대화를 나눈 이후, 영주는 도통 </p><p class="c53 c455 c146">기운이 나지 않았다. 기지개를 억지로 켜며 기운을 내려 해도 몸은</p><p class="c53 c455 c146">축 처지기만 했다. 괜찮아진 것 같다가도 지금처럼 다시금 무너져 </p><p class="c53 c455 c146">내릴 때가 있었다. 양 손바닥으로 두 뺨을 두드리거나 서점 밖을 서</p><p class="c53 c455 c146">성이거나 노랫말을 흥얼거리며 애써 과거에서 빠져나와도 그때뿐</p><p class="c53 c455 c146">이었다.</p><p class="c53 c455 c146">   영주는 엄마가 그녀에게 퍼부었던 말들이 떠오르자 눈을 질끈 감</p><p class="c53 c455 c146">았다. 엄마는 처음부터 마지막 순간까지 영주가 아닌 그의 편이었다.</p><p class="c53 c455 c146">엄마는 새벽마다 집으로 찾아와 영주가 아닌 그에게 아침밥을 차려</p><p class="c53 c455 c146">주었다. 사위는 말없이 장모의 상을 받으며 장모가 아내를 나무라는</p><p class="c53 c146">모습을 바라보았다. 장모가 없을 때 그는 그녀에게 괜찮은지 물었다.</p></div></div></template>

431 c432" data-node-id="388:2142" data-name="Close"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-19.svg"/></div><div class="c50 c3 c307 c308 c111 c509 c55 c112 c96 c503 c60" data-node-id="523:6758"><p class="c53 c455 c146">   요즘엔 퇴근하고 집에 오면 늘 6시 언저리다. 씻고 저녁 준비하</p><p class="c53 c455 c146">고 밥을 먹고 조금 시간을 보내다가 설거지까지 끝내면 8시 정도</p><p class="c53 c455 c146">된다. 승우는 그때를 기점으로 완전히 다른 사람이 된다. 더는 무난</p><p class="c53 c455 c146">한 직장인을 연기하는 연기자일 필요 없다. 책임이라는 직급을 벗</p><p class="c53 c455 c146">고, 기계적인 행동과 생각을 지우고, 무감해지려는 노력도 그만둔</p><p class="c53 c455 c146">다. 이제 온전히 나 자신으로 존재하는 시간. 지금부터가 진짜 시간</p><p class="c53 c455 c146">이다.</p><p class="c53 c455 c146">   지난 몇 년 퇴근 후 집으로 돌아와 잠자리에 들 때까지, 승우는</p><p class="c53 c455 c146">한 번 꽂히면 질릴 떄까지 파고드는 타고난 성향을 마음껏 풀어놓</p><p class="c53 c455 c146">았다. 승우가 꽂힌 대상은 한국어였다. 그 전에는 프로그래밍 언어</p><p class="c53 c455 c146">에 푹 빠져 10여 년을 보냈다. 하지만 승우는 이제 더는 프로그래머</p><p class="c53 c146">가 아니다. 그저 습관처럼 출근했다 퇴근하는 직장인일 뿐이다.</p></div></div></template>

ets/asset-22.svg"/></div><div class="c3 c419 c422 c374 c421" data-node-id="291:29693" data-name="미리보기"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-17.svg"/></div><div class="c3 c396 c423 c395 c397" data-node-id="291:29695"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-18.svg"/></div><div class="c3 c184 c450 c451 c185" data-node-id="291:29705" data-name="문학"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-23.svg"/></div></div><div class="c50 c3 c307 c308 c111 c522 c55 c112 c96 c324 c60" data-node-id="291:29709"><p class="c53 c455 c146">   정서는 벽에 등을 기댄 채 침을 꿀꺽 삼키고는 이야기를 시작했</p><p class="c53 c455 c146">다. 대학을 졸업하고 직장 생활 8년째이던 올봄, 정서는 퇴사를 결</p><p class="c53 c455 c146">심했다. 매일 화가 나는 상황에 너무 화가 나서였다. 출근을 하다</p><p class="c53 c455 c146">가, 밥을 먹다가, 텔레비전을 보다가 순간적으로 화가 나 그게 무</p><p class="c53 c146">엇이든 눈에 보이는 건 다 때려 부수고 싶었다. </p></div><div class="c3 c169 c424 c129 c92" data-node-id="291:29710"><div class="c3 c171"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset-16.svg"/></div></div><a class="c3 c79 c315 c425 c426" data-node-id="291:29711" data-name="종료하기"><div class="c3 c318 c132 c133 c68 c376 c425 c320 c426 c92" data-node-id="291:29712"></div><p class="c50 c3 c307 c308 c427 c53 c428 c55 c57 c96 c429 c43" data-node-id="291:29713">종료하기</p></a><div class="c3 c79 c456 c457" data-node-id="336:1892" data-name="랜덤미리보기이동"><div class="c3 c458 c72 c459 c456 c460 c461 c462" data-node-id="336:1893" data-name="블러"></div><div class="c50 c3 c153 c154 c45 c111 c463 c55 c306 c96 c457 c464 c114" data-node-id="336:1894"><p class="c53 c115">다른 랜덤 미리보기가  필요하신가요?</p><p class="c53">​</p></div><a class="c3 c32 c315 c465 c466 c467 c468" data-node-id="336:1895" data-name="새로고침"><div class="c3 c469"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset-24.svg"/></div></a></div><div class="c3 c430 c431 c432" data-node-id="388:2153" data-name="Close"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-19.svg"/></div><div class="c50 c3 c307 c308 c111 c90 c55 c112 c96 c516 c60" data-node-id="523:6761"><p class="c53 c455 c146">   명상을 시작한 계기를 말하려면 회사를 왜 그만뒀는지부터 말</p><p class="c53 c455 c146">해야 했다. </p><p class="c53 c455 c146">   “제가 너무 화가 나서 회사를 그만뒀거든요?”</p><p class="c53 c455 c146">   정서는 벽에 등을 기댄 채 침을 꿀꺽 삼키고는 이야기를 시작했</p><p class="c53 c455 c146">다. 대학을 졸업하고 직장 생활 8년째이던 올봄, 정서는 퇴사를 결</p><p class="c53 c455 c146">심했다. 매일 화가 나는 상황에 너무 화가 나서였다. 출근을 하다</p><p class="c53 c455 c146">가, 밥을 먹다가, 텔레비전을 보다가 순간적으로 화가 나 그게 무</p><p class="c53 c455 c146">엇이든 눈에 보이는 건 다 때려 부수고 싶었다. 내가 왜 이러나 싶</p><p class="c53 c455 c146">어 병원에 가봤지만 의사가 하는 말이라곤 스트레스를 받지 말라</p><p class="c53 c455 c146">는게 전부였다.</p><p class="c53 c455 c146">   정서는 계약직으로 일을 시작해 계약직으로 일을 끝맺었다. 처</p><p class="c53 c455 c146">음엔 2년 열심히 일하면 정규직이 될 수 있다는 팀장의 말을 곧이</p><p class="c53 c146">곧대로 믿었다.</p></div></div></template>

ets/asset-22.svg"/></div><div class="c3 c419 c422 c374 c421" data-node-id="291:30026" data-name="미리보기"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-17.svg"/></div><div class="c3 c396 c423 c395 c397" data-node-id="291:30028"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-18.svg"/></div><div class="c3 c184 c450 c451 c185" data-node-id="291:30038" data-name="문학"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-23.svg"/></div></div><div class="c50 c3 c307 c308 c111 c456 c55 c112 c96 c500 c60" data-node-id="291:30042"><p class="c53 c455 c146">   차분한 분위기의 동네였다. 불과 10분 전만 해도 번잡한 거리를 </p><p class="c53 c455 c146">지나와야 해던 승우는 마치 연극이 끝나고 난 뒤의 무대를 걷고 있</p><p class="c53 c455 c146">는 기분이었다. 이 동네를 지나다니는 사람들의 손엔 쇼핑백이 아닌</p><p class="c53 c455 c146">장바구니가 들려 있을 것 같았고, 그들이 골목을 걷다 마주치는 사</p><p class="c53 c455 c146">람들은 대부분 낯선 이가 아닌 이미 눈인사 몇 번 정도 나눠본 이들</p><p class="c53 c146">일 것 같았다. </p></div><div class="c3 c169 c424 c129 c92" data-node-id="291:30043"><div class="c3 c171"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset-16.svg"/></div></div><a class="c3 c79 c315 c425 c426" data-node-id="291:30044" data-name="종료하기"><div class="c3 c318 c132 c133 c68 c376 c425 c320 c426 c92" data-node-id="291:30045"></div><p class="c50 c3 c307 c308 c427 c53 c428 c55 c57 c96 c429 c43" data-node-id="291:30046">종료하기</p></a><div class="c3 c79 c456 c457" data-node-id="336:1900" data-name="랜덤미리보기이동"><div class="c3 c458 c72 c501 c456 c460 c483 c462" data-node-id="336:1901" data-name="블러"></div><div class="c50 c3 c153 c154 c45 c111 c463 c55 c306 c96 c457 c464 c114" data-node-id="336:1902"><p class="c53 c115">다른 랜덤 미리보기가  필요하신가요?</p><p class="c53">​</p></div><a class="c3 c32 c315 c465 c466 c467 c468" data-node-id="336:1903" data-name="새로고침"><div class="c3 c469"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset-24.svg"/></div></a></div><div class="c3 c430 c431 c432" data-node-id="388:2163" data-name="Close"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-19.svg"/></div><div class="c50 c3 c307 c308 c111 c474 c55 c112 c96 c503 c60" data-node-id="523:6762"><p class="c53 c455 c146">   승우는 두툼한 점퍼를 걸치고 백팩을 멘 채 휴남동 서점으로 걸</p><p class="c53 c455 c146">어가고 있었다. 차를 타고 가도 됐지만 지하철역에서 서점까지의 길</p><p class="c53 c455 c146">을 한번 걸어보고 싶었다. 지난번에도 느꼈지만 휴남동 서점을 확실</p><p class="c53 c455 c146">히 우연히 지나가다 들르는 그런 종류의 서점을 나이었다. 동네 사</p><p class="c53 c455 c146">람이 아니고서는 마음먹고 찾아와야 하는 곳. 이런 곳에다가 영주</p><p class="c53 c455 c146">는 모슨 생각으로, 어떤 이유로 서점을 열었을까.</p><p class="c53 c455 c146">   차분한 분위기의 동네였다. 불과 10분 전만 해도 번잡한 거리를 </p><p class="c53 c455 c146">지나와야 해던 승우는 마치 연극이 끝나고 난 뒤의 무대를 걷고 있</p><p class="c53 c455 c146">는 기분이었다. 이 동네를 지나다니는 사람들의 손엔 쇼핑백이 아닌</p><p class="c53 c455 c146">장바구니가 들려 있을 것 같았고, 그들이 골목을 걷다 마주치는 사</p><p class="c53 c455 c146">람들은 대부분 낯선 이가 아닌 이미 눈인사 몇 번 정도 나눠본 이들</p><p class="c53 c146">일 것 같았다. </p></div></div></template>

ets/asset-22.svg"/></div><div class="c3 c419 c422 c374 c421" data-node-id="291:30359" data-name="미리보기"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-17.svg"/></div><div class="c3 c396 c423 c395 c397" data-node-id="291:30361"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-18.svg"/></div><div class="c3 c184 c450 c451 c185" data-node-id="291:30371" data-name="문학"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-23.svg"/></div></div><div class="c50 c3 c307 c308 c111 c486 c55 c112 c96 c343 c60" data-node-id="291:30375"><p class="c53 c455 c146">   담당 기자는 승우의 이런 성향을 일찍이 간파했다. 승우가 마음</p><p class="c53 c455 c146">에 쏙 든 이유였다. 이쪽에서 연락하지 않으면 저쪽에서 연락 올 일</p><p class="c53 c455 c146">이 전혀 없다는 사실에 일 하나가 줄어든 기분이었고, 2주에 한 번</p><p class="c53 c455 c146">제시간에 딱딱 도착하는 칼럼 역시 딱히 손볼 데가 없었다. 애초에</p><p class="c53 c455 c146">첨예한 농쟁을 불러온다거나 악플에 시달릴 칼럼이 아니어서 머리</p><p class="c53 c455 c146">쓰며 사실 여부를 따질 필요도 없었고, 또 문장을 잘 아는 칼럼니스</p><p class="c53 c146">트이니 따로 문장을 수정할 필요도 없었다.</p></div><div class="c3 c169 c424 c129 c92" data-node-id="291:30376"><div class="c3 c171"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset-16.svg"/></div></div><a class="c3 c79 c315 c425 c426" data-node-id="291:30377" data-name="종료하기"><div class="c3 c318 c132 c133 c68 c376 c425 c320 c426 c92" data-node-id="291:30378"></div><p class="c50 c3 c307 c308 c427 c53 c428 c55 c57 c96 c429 c43" data-node-id="291:30379">종료하기</p></a><div class="c3 c79 c456 c523" data-node-id="336:1908" data-name="랜덤미리보기이동"><div class="c3 c458 c72 c524 c456 c460 c525 c462" data-node-id="336:1909" data-name="블러"></div><div class="c50 c3 c153 c154 c45 c111 c463 c55 c306 c96 c523 c464 c114" data-node-id="336:1910"><p class="c53 c115">다른 랜덤 미리보기가  필요하신가요?</p><p class="c53">​</p></div><a class="c3 c32 c315 c465 c466 c467 c468" data-node-id="336:1911" data-name="새로고침"><div class="c3 c469"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset-24.svg"/></div></a></div><div class="c3 c430 c431 c432" data-node-id="388:2165" data-name="Close"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-19.svg"/></div><div class="c50 c3 c307 c308 c111 c487 c55 c112 c96 c526 c60" data-node-id="523:6763"><p class="c53 c455 c146">   영주가 칼럼을 쓰게 된 데에 승우가 한 역할은 없었다. 다만, 담</p><p class="c53 c455 c146">당 기자가 승우 덕분에 영주를 알게 된 건 맞았다. 기자는 승우를</p><p class="c53 c455 c146">지금껏 딱 한 번 만났다. 한번 얼굴이나 보자는 기자의 말을 승우</p><p class="c53 c455 c146">는 매번 에둘러 거절했다. 어차피 기자도 승우가 만나고 싶어 그러</p><p class="c53 c455 c146">는 건 아니었다. 그래도 담당 기자이니 가끔 안부라도 물어야 한다</p><p class="c53 c455 c146">는 책임감 때문에 형식적으로 만남을 제안하곤 했던 거니까. 서로</p><p class="c53 c455 c146">마음이 동하지 않는데 불필요하게 만나 친한 척 이야기를 나눠야</p><p class="c53 c455 c146">하는 상황 자체를 승우는 싫어하는 것 같았다.</p><p class="c53 c455 c146">   담당 기자는 승우의 이런 성향을 일찍이 간파했다. 승우가 마음</p><p class="c53 c455 c146">에 쏙 든 이유였다. 이쪽에서 연락하지 않으면 저쪽에서 연락 올 일</p><p class="c53 c455 c146">이 전혀 없다는 사실에 일 하나가 줄어든 기분이었고, 2주에 한 번</p><p class="c53 c455 c146">제시간에 딱딱 도착하는 칼럼 역시 딱히 손볼 데가 없었다. 애초에</p><p class="c53 c455 c146">첨예한 농쟁을 불러온다거나 악플에 시달릴 칼럼이 아니어서 머리</p><p class="c53 c455 c146">쓰며 사실 여부를 따질 필요도 없었고, 또 문장을 잘 아는 칼럼니스</p><p class="c53 c146">트이니 따로 문장을 수정할 필요도 없었다.</p></div></div></template>

/asset-24.svg"/></div></a></div><div class="c3 c430 c431 c432" data-node-id="388:2160" data-name="Close"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-19.svg"/></div><div class="c50 c3 c307 c308 c111 c90 c55 c112 c96 c503 c60" data-node-id="523:6765"><p class="c53 c455 c146">   칼럼을 연재한 지 한 달쯤 지나자 한 신문사에서 연락이 왔다.</p><p class="c53 c455 c146">동네 서점 대표 영주를 인터뷰하고 싶다는 내용이었다. 잠시 망</p><p class="c53 c455 c146">설였지만 제안을 받아들였다. 서점이 자리를 잡는 데, 도움이 될</p><p class="c53 c455 c146">것 같았다.</p><p class="c53 c455 c146">   신문에 인터뷰가 실리고 나자 서점을 찾아오는 손님들에게서 </p><p class="c53 c455 c146">이전과 다른 점이 보였다. 전부터 알고 지내던 사람을 만난 듯 영</p><p class="c53 c455 c146">주를 보며 눈인사를 하거나 말을 걸어오는 손님들이 생겼다. 손님</p><p class="c53 c455 c146">이 늘었고, 따라서 매출도 늘었다. 인터뷰 한 번 만에 이런 변화가 </p><p class="c53 c455 c146">찾아왔다는 것이 놀라웠다. 인터뷰만큼 즉각적인 반응이 오지는 </p><p class="c53 c455 c146">않았지만 칼럼을 읽고 찾아오는 손님들도 있었다. 예전에 영주에</p><p class="c53 c455 c146">게 말을 거는 손님들은 대개 SNS 글을 소재로 삼았는데, 최근엔</p><p class="c53 c146">칼럼을 소재로 삼는 사람이 더 많았다.</p></div></div></template>

ets/asset-22.svg"/></div><div class="c3 c419 c422 c536 c421" data-node-id="291:32357" data-name="미리보기"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-27.svg"/></div><div class="c3 c396 c423 c395 c397" data-node-id="291:32359"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-18.svg"/></div><div class="c3 c184 c450 c451 c185" data-node-id="291:32369" data-name="문학"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-23.svg"/></div></div><div class="c50 c3 c307 c308 c111 c486 c55 c112 c96 c343 c60" data-node-id="291:32373"><p class="c53 c455 c146">  민준이 매일 이곳으로 와서 커피를 내리는 이유는 무엇보다 고트</p><p class="c53 c455 c146">빈 사람들이 커피 맛에 더없이 진지해서다. 실없는 농담을 주고받</p><p class="c53 c455 c146">다가도 민준이 커피 잔을 내밀 때면 언제 그랬냐는 듯 진지해지곤</p><p class="c53 c455 c146">한다. 향을 맡고 맛을 음미하고 목 넘김을 느끼는 과정 하나하나에 </p><p class="c53 c455 c146">섬세하게 반응한다. 본인들이 로스팅한 원두가 어떤 맛을 내는지,</p><p class="c53 c455 c146">어떤 맛을 내야 하는지, 그들은 민준이 내린 커피를 통해 감을 잡는</p><p class="c53 c146">다.</p></div><div class="c3 c169 c424 c129 c92" data-node-id="291:32374"><div class="c3 c171"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset-16.svg"/></div></div><a class="c3 c79 c315 c425 c426" data-node-id="291:32375" data-name="종료하기"><div class="c3 c318 c132 c133 c68 c376 c425 c320 c426 c92" data-node-id="291:32376"></div><p class="c50 c3 c307 c308 c427 c53 c428 c55 c57 c96 c429 c43" data-node-id="291:32377">종료하기</p></a><div class="c3 c79 c456 c537" data-node-id="336:1956" data-name="랜덤미리보기이동"><div class="c3 c458 c72 c520 c456 c460 c521 c462" data-node-id="336:1957" data-name="블러"></div><div class="c50 c3 c153 c154 c45 c111 c463 c55 c306 c96 c537 c464 c114" data-node-id="336:1958"><p class="c53 c115">다른 랜덤 미리보기가  필요하신가요?</p><p class="c53">​</p></div><a class="c3 c32 c315 c465 c466 c467 c468" data-node-id="336:1959" data-name="새로고침"><div class="c3 c469"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset-24.svg"/></div></a></div><div class="c3 c430 c431 c432" data-node-id="388:2169" data-name="Close"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-19.svg"/></div><div class="c50 c3 c307 c308 c111 c487 c55 c112 c96 c493 c60" data-node-id="523:6770"><p class="c53 c455 c146">   민준은 요가가 끝나면 집으로 돌아와 샤워를 하고는 매일 고트</p><p class="c53 c455 c146">빈으로 향한다. 요즘 그는 고트빈에서 로스팅을 배우고 있다. 커피</p><p class="c53 c455 c146">가 만들어지는 과정을 더 자세히 알면 커피 맛을 내는 데 도움이</p><p class="c53 c455 c146">될까 해서다. 지미와 로스터들의 모닝커피도 민준의 몫이다. 고트</p><p class="c53 c455 c146">빈 사람들 기호에 맞게 각기 다른 맛으로 커피를 내렸다. 어떻게 보</p><p class="c53 c455 c146">면 이곳이 서점보다도 커피 연습하기엔 더 좋은 장소다. 원하는 원</p><p class="c53 c455 c146">두를 아무 때나 구할 수 있고, 만약 없을 땐 지미를 잘 꼬드기면 곧 </p><p class="c53 c455 c146">구해다 주기 때문이다.</p><p class="c53 c455 c146">  민준이 매일 이곳으로 와서 커피를 내리는 이유는 무엇보다 고트</p><p class="c53 c455 c146">빈 사람들이 커피 맛에 더없이 진지해서다. 실없는 농담을 주고받</p><p class="c53 c455 c146">다가도 민준이 커피 잔을 내밀 때면 언제 그랬냐는 듯 진지해지곤</p><p class="c53 c455 c146">한다. 향을 맡고 맛을 음미하고 목 넘김을 느끼는 과정 하나하나에 </p><p class="c53 c455 c146">섬세하게 반응한다. 본인들이 로스팅한 원두가 어떤 맛을 내는지,</p><p class="c53 c455 c146">어떤 맛을 내야 하는지, 그들은 민준이 내린 커피를 통해 감을 잡는</p><p class="c53 c146">다.</p></div></div></template>

c432" data-node-id="388:2164" data-name="Close"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-19.svg"/></div><div class="c50 c3 c307 c308 c111 c509 c55 c112 c96 c506 c60" data-node-id="523:6772"><p class="c53 c455 c146">   집으로 돌아온 영주는 더없이 힘든 일을 처리하듯 몸을 씻고 옷</p><p class="c53 c455 c146">을 갈아입은 뒤 침대에 누웠다. 몸도 마음도 너무나 피곤했지만</p><p class="c53 c455 c146">잠은 오지 않았다. 창인의 얼굴이 흐릿하게 떠올랐다가 사라졌다.</p><p class="c53 c455 c146">   그녀는 침대에서 몸을 일으켜 옆에 놓여 있던 책을 들고 거실로</p><p class="c53 c455 c146">나왔다. 거실 창가에 앉아 어제 마지막으로 읽은 페이지를 폈다. 첫</p><p class="c53 c455 c146">문장부터 읽어보려 했으나 도통 무슨 내용인지 머리에 들어오지 않</p><p class="c53 c455 c146">아서, 아예 책의 첫 페이지부터 읽기로 했다. 겨우 한 문장, 한 문장</p><p class="c53 c455 c146">읽어나가다가 영주는 책을 덮고 무릎을 안아 올렸다. 무릎 위에 두</p><p class="c53 c455 c146">팔을 올리고 그 위에 턱을 올린 채 창밖으로 시선을 돌렸다. 친구로</p><p class="c53 c455 c146">보이는 남녀가 얘기를 주고받으며 지나가는 모습이 보였다. 그들을</p><p class="c53 c146">보니 오늘 오후 태우와 주고받았던 대화가 떠올랐다. </p></div></div></template>

lass="c3 c32 c19 c33 c2" src="assets/asset-15.svg"/></div><div class="c3 c396 c398 c395 c397" data-node-id="291:33328"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-15.svg"/></div></div></div></div><div class="c3 c79 c385 c390" data-node-id="291:33338" data-name="쇼핑백담기"><div class="c3 c72 c132 c133 c68 c119 c385 c120 c390 c377" data-node-id="291:33339"></div><div class="c3 c79 c399 c393" data-node-id="291:33340"><p class="c49 c50 c3 c135 c52 c53 c400 c136 c95 c58 c393 c60" data-node-id="291:33341">한면보기</p></div></div></div></div></div><div class="c50 c3 c79 c373 c55 c401 c60" data-node-id="291:33342" data-name="내용"><div class="c3 c153 c154 c111 c373 c224 c96 c401" data-node-id="291:33343"><p class="c53 c115 c146">어서오세요 </p><p class="c53 c146">휴남동 서점입니다</p></div><p class="c3 c51 c52 c53 c373 c156 c95 c402" data-node-id="291:33344">저자 : 황보름</p><p class="c3 c51 c52 c53 c373 c156 c95 c175" data-node-id="291:33345">출판사 : 클레이하우스</p></div><div class="c50 c3 c79 c51 c52 c53 c34 c55 c156 c95 c403 c60" data-node-id="291:33346" data-name="정가"><p class="c3 c34 c403" data-node-id="291:33347">정가</p><p class="c3 c404 c403" data-node-id="291:33348">15,000원</p></div><div class="c3 c169 c34 c405 c92" data-node-id="291:33349"><div class="c3 c171"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset-16.svg"/></div></div><div class="c3 c169 c373 c406 c92" data-node-id="291:33350"><div class="c3 c171"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset-16.svg"/></div></div></div><div class="c3 c79 c369 c415" data-node-id="291:33351" data-name="상단 미리보기 배너"><div class="c3 c416 c417 c369 c415 c78" data-node-id="291:33352"></div><p class="c50 c3 c153 c154 c53 c373 c55 c155 c100 c418 c60" data-node-id="291:33353">도서 미리보기</p></div><div class="c3 c419 c420 c374 c421" data-node-id="291:33354" data-name="미리보기"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-22.svg"/></div><div class="c3 c419 c422 c374 c421" data-node-id="291:33356" data-name="미리보기"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-17.svg"/></div><div class="c3 c396 c423 c395 c397" data-node-id="291:33358"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-18.svg"/></div><div class="c3 c184 c450 c451 c185" data-node-id="291:33368" data-name="문학"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-23.svg"/></div></div><div class="c50 c3 c307 c308 c111 c456 c55 c112 c96 c500 c60" data-node-id="291:33372"><p class="c53 c455 c146">   영주가 놀라 무슨 일이냐고 묻자 희주는 눈을 흘기며 대답 없이</p><p class="c53 c455 c146">영주의 얼굴을 요리조리 살폈다. 서점 오픈 초, 영주가 질질 짜는</p><p class="c53 c455 c146">모습을 수도 없이 봤던 희주였다. 한동안 괜찮더니 또 무슨 일인가</p><p class="c53 c455 c146">싶어 찾아온 모양이었다. 영주가 희주의 집요한 눈빛을 받으며 씩씩</p><p class="c53 c455 c146">하게 웃자 희주는 그제야 안심한 듯 독서 모임에 관해 이런저런 의</p><p class="c53 c146">견을 내놓고는 서점 문을 나섰다. </p></div><div class="c3 c169 c424 c129 c92" data-node-id="291:33373"><div class="c3 c171"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset-16.svg"/></div></div><a class="c3 c79 c315 c425 c426" data-node-id="291:33374" data-name="종료하기"><div class="c3 c318 c132 c133 c68 c376 c425 c320 c426 c92" data-node-id="291:33375"></div><p class="c50 c3 c307 c308 c427 c53 c428 c55 c57 c96 c429 c43" data-node-id="291:33376">종료하기</p></a><div class="c3 c79 c456 c442" data-node-id="336:1980" data-name="랜덤미리보기이동"><div class="c3 c458 c72 c501 c456 c460 c483 c462" data-node-id="336:1981" data-name="블러"></div><div class="c50 c3 c153 c154 c45 c111 c463 c55 c306 c96 c442 c464 c114" data-node-id="336:1982"><p class="c53 c115">다른 랜덤 미리보기가  필요하신가요?</p><p class="c53">​</p></div><a class="c3 c32 c315 c465 c466 c467 c468" data-node-id="336:1983" data-name="새로고침"><div class="c3 c469"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset-24.svg"/></div></a></div><div class="c3 c430 c431 c432" data-node-id="388:2158" data-name="Close"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-19.svg"/></div><div class="c50 c3 c307 c308 c111 c474 c55 c112 c96 c503 c60" data-node-id="523:6773"><p class="c53 c455 c146">   당연하게도 어제 그런 일이 있었다고 해서 오늘 서점 분위기가</p><p class="c53 c455 c146">달라질 건 없었다. 전체적으로 보면 서점은 늘 그렇듯 손님이 몰</p><p class="c53 c455 c146">릴 땐 다소 정신이 없었고, 그 반대일 땐 과일 타임을 낼 수 있었</p><p class="c53 c455 c146">다. 몇 가지 소소한 장면이 연출되기는 했다. 정오 즈음 영주 혼자</p><p class="c53 c455 c146">출근해 오픈 준비를 하고 있을 때 희주가 서점 문을 열고 들어왔다.</p><p class="c53 c455 c146">오픈 전엔 서점을 찾은 적 없던 희주였다.</p><p class="c53 c455 c146">   영주가 놀라 무슨 일이냐고 묻자 희주는 눈을 흘기며 대답 없이</p><p class="c53 c455 c146">영주의 얼굴을 요리조리 살폈다. 서점 오픈 초, 영주가 질질 짜는</p><p class="c53 c455 c146">모습을 수도 없이 봤던 희주였다. 한동안 괜찮더니 또 무슨 일인가</p><p class="c53 c455 c146">싶어 찾아온 모양이었다. 영주가 희주의 집요한 눈빛을 받으며 씩씩</p><p class="c53 c455 c146">하게 웃자 희주는 그제야 안심한 듯 독서 모임에 관해 이런저런 의</p><p class="c53 c146">견을 내놓고는 서점 문을 나섰다. </p></div></div></template>

ets/asset-22.svg"/></div><div class="c3 c419 c499 c374 c421" data-node-id="291:34355" data-name="미리보기"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-27.svg"/></div><div class="c3 c396 c423 c395 c397" data-node-id="291:34357"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-18.svg"/></div><div class="c3 c184 c450 c451 c185" data-node-id="291:34367" data-name="문학"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-23.svg"/></div></div><div class="c50 c3 c307 c308 c111 c539 c55 c112 c96 c500 c60" data-node-id="291:34371"><p class="c53 c455 c146">   그녀는 딱히 목적이 있는 것 같지는 않지만, 그렇다고 아예 쓸</p><p class="c53 c455 c146">데없는 것 같지도 않은 행동을 하고 있었다. 원두 섞기.</p><p class="c53 c455 c146">   “이 원두 저 원두 대중없이 섞다 보면······ 어쩌면 지금껏 맛보지 못</p><p class="c53 c455 c146">한 정말 맛있는 커피를 얻게 되지 않을까?”</p><p class="c53 c455 c146">   지미가 고개도 들지 않고 혼잣말처럼 중얼거렸다. 그러다 오늘따</p><p class="c53 c146">라 순하게 앉아 있는 민준을 의식하며 말했다.</p></div><div class="c3 c169 c424 c129 c92" data-node-id="291:34372"><div class="c3 c171"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset-16.svg"/></div></div><a class="c3 c79 c315 c425 c426" data-node-id="291:34373" data-name="종료하기"><div class="c3 c318 c132 c133 c68 c376 c425 c320 c426 c92" data-node-id="291:34374"></div><p class="c50 c3 c307 c308 c427 c53 c428 c55 c57 c96 c429 c43" data-node-id="291:34375">종료하기</p></a><div class="c3 c79 c456 c478" data-node-id="336:2004" data-name="랜덤미리보기이동"><div class="c3 c458 c72 c465 c456 c460 c514 c462" data-node-id="336:2005" data-name="블러"></div><div class="c50 c3 c153 c154 c45 c111 c463 c55 c306 c96 c478 c464 c114" data-node-id="336:2006"><p class="c53 c115">다른 랜덤 미리보기가  필요하신가요?</p><p class="c53">​</p></div><a class="c3 c32 c315 c465 c466 c467 c468" data-node-id="336:2007" data-name="새로고침"><div class="c3 c469"><img draggable="false" decoding="async" alt="" class="c32 c33 c2" src="assets/asset- /div></a></div><div class="c3 c430 c431 c432" data-node-id="388:2135" data-name="Close"><img draggable="false" decoding="async" alt="" class="c3 c32 c19 c33 c2" src="assets/asset-19.svg"/></div><div class="c50 c3 c307 c308 c111 c534 c55 c112 c96 c506 c60" data-node-id="523:6777"><p class="c53 c455 c146">   민준 씨, 제가 민준 씨 처음 만난 날 했던 말 기억해요? 서점을</p><p class="c53 c455 c146">2년밖에 못 할지도 모른다고 했었죠. 첫날부터 그런 말을 한 건 </p><p class="c53 c455 c146">미리 말을 해줘야 민준 씨도 민준 씨 나름의 미래를 계획할 수 있</p><p class="c53 c455 c146">을 거라 생각해서였어요. 그리고 어느덧, 우리가 함께 보낸 시간</p><p class="c53 c455 c146">이 2년이 다 되어가네요.</p><p class="c53 c455 c146">   서점을 열고 처음 1년은 어떻게 지나갔는지도 모르게 지나갔어</p><p class="c53 c455 c146">요. 민준 씨가 없던 휴남동 서점은 많이 어설펐어요. 다행히 그때</p><p class="c53 c455 c146">는 제가 이런저런 실수를 해도 크게 티가 나지는 않았지만요. 손</p><p class="c53 c455 c146">님이 거의 없었으니까요. 그 시절의 휴남동 서점을 알고 싶으면 </p><p class="c53 c455 c146">민철 어머니에게 한번 물어봐요. 민철 어머니는 우리 서점에 대해</p><p class="c53 c146">모르는 게 없거든요.</p></div></div></template>
